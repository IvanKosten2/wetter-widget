<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --text-color: #1a1a1a;
    --text-muted: #555;
    --accent: #0066cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-color: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #4da6ff;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent; /* SharePoint-Hintergrund scheint durch */
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: var(--text-color);
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
  }
  .weather-card {
    flex: 1 1 280px;
    max-width: 320px;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
    /* Kein eigener Hintergrund – transparent */
    background: transparent;
    border: 1px solid var(--text-muted);
  }
  @media (prefers-color-scheme: dark) {
    .weather-card { border-color: rgba(255,255,255,0.2); }
  }
  .city { font-size: 1.2em; font-weight: 600; color: var(--accent); }
  .time { font-size: 2.8em; font-weight: 300; margin: 8px 0; font-variant-numeric: tabular-nums; }
  .date { font-size: 0.95em; color: var(--text-muted); }
  .temp { font-size: 3.2em; font-weight: 200; margin: 12px 0; }
  .desc { font-size: 1.1em; color: var(--text-muted); }
  @media (max-width: 480px) {
    .weather-card { flex: 1 1 100%; }
    .time { font-size: 2.2em; }
    .temp { font-size: 2.6em; }
  }
</style>
</head>
<body>

<div class="weather-card" id="card-brakel">
  <div class="city">Brakel</div>
  <div class="time" id="time-brakel">--:--</div>
  <div class="date" id="date-brakel">Lade...</div>
  <div class="temp" id="temp-brakel">--</div>
  <div class="desc" id="desc-brakel">...</div>
</div>

<div class="weather-card" id="card-rom">
  <div class="city">Standort</div>
  <div class="time" id="time-rom">--:--</div>
  <div class="date" id="date-rom">Lade...</div>
  <div class="temp" id="temp-rom">--</div>
  <div class="desc" id="desc-rom">...</div>
</div>

<script>
// === Konfiguration: Hier deine Orte eintragen ===
const LOCATIONS = [
  { id: 'brakel', name: 'Brakel', lat: 51.7147, lon: 9.1839, tz: 'Europe/Berlin' },
  { id: 'rom',   name: 'Rumänien', lat: 44.4268, lon: 26.1025, tz: 'Europe/Bucharest' }
];

// WMO Wettercodes → deutsche Beschreibungen
const WEATHER_CODES = {
  0: 'Klar', 1: 'Überwiegend klar', 2: 'Teilweise bewölkt', 3: 'Bewölkt',
  45: 'Nebel', 48: 'Reifnebel',
  51: 'Leichter Sprühregen', 53: 'Sprühregen', 55: 'Dichter Sprühregen',
  61: 'Leichter Regen', 63: 'Regen', 65: 'Starker Regen',
  66: 'Leichter Eisregen', 67: 'Starker Eisregen',
  71: 'Leichter Schneefall', 73: 'Schneefall', 75: 'Starker Schneefall',
  77: 'Schneegriesel',
  80: 'Leichte Regenschauer', 81: 'Regenschauer', 82: 'Heftige Regenschauer',
  85: 'Leichte Schneeschauer', 86: 'Starke Schneeschauer',
  95: 'Gewitter', 96: 'Gewitter mit leichtem Hagel', 99: 'Gewitter mit starkem Hagel'
};

// Uhrzeit und Datum live aktualisieren (ohne externe API)
function updateClock(loc) {
  const now = new Date();
  const timeStr = new Intl.DateTimeFormat('de-DE', {
    hour: '2-digit', minute: '2-digit', timeZone: loc.tz
  }).format(now);
  const dateStr = new Intl.DateTimeFormat('de-DE', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: loc.tz
  }).format(now);
  document.getElementById('time-' + loc.id).textContent = timeStr;
  document.getElementById('date-' + loc.id).textContent = dateStr;
}

// Wetter von Open-Meteo abrufen (kostenlos, kein API-Key)
async function fetchWeather(loc) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code&timezone=auto`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    const desc = WEATHER_CODES[code] || 'Unbekannt';
    document.getElementById('temp-' + loc.id).textContent = `${temp}°`;
    document.getElementById('desc-' + loc.id).textContent = desc;
  } catch (e) {
    document.getElementById('desc-' + loc.id).textContent = 'Fehler beim Laden';
  }
}

// Initialisierung
LOCATIONS.forEach(loc => {
  updateClock(loc);
  fetchWeather(loc);
  // Uhr jede Sekunde aktualisieren
  setInterval(() => updateClock(loc), 1000);
  // Wetter alle 10 Minuten aktualisieren
  setInterval(() => fetchWeather(loc), 600000);
});
</script>
</body>
</html>
